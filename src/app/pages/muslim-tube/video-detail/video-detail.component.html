<!-- Video Detail Page -->
<div class="video-detail-container">
  @if (video) {
    <!-- Video Player Section -->
    <div class="video-player-section">
      <div class="video-player-wrapper">
        <img [src]="video.image" [alt]="video.title" class="video-player" />
        <span class="video-duration">{{ video.duration }}</span>
      </div>
    </div>

    <!-- Title -->
    <div class="title-section">
      <h1 class="video-title">{{ video.title }}</h1>
    </div>

    <!-- Channel Info and Actions -->
    <div class="channel-info-section">
      <div class="channel-info">
        <img [src]="video.channelLogo" [alt]="video.channelTitle" class="channel-logo" />
        <div class="channel-details">
          <h3 class="channel-title">{{ video.channelTitle }}</h3>
          <p class="video-date">{{ video.date }}</p>
        </div>
      </div>
      <div class="actions-bar">
        <button class="action-btn" (click)="toggleLike()" [class.active]="isLiked">
          <div [inlineSVG]="'/icons/icons-24/liked.svg'" class="action-icon"></div>
          <span>{{ formatNumber(video.likes) }}</span>
        </button>
        <button class="action-btn" (click)="toggleSave()" [class.active]="isSaved">
          <div [inlineSVG]="'/icons/icons-24/save.svg'" class="action-icon"></div>
          <span>Save</span>
        </button>
        <button class="action-btn" (click)="share()">
          <div [inlineSVG]="'/icons/icons-24/share.svg'" class="action-icon"></div>
          <span>Share</span>
        </button>
        <button class="action-btn" (click)="download()">
          <div [inlineSVG]="'/icons/icons-24/download.svg'" class="action-icon"></div>
          <span>Download</span>
        </button>
      </div>
    </div>

    <!-- Description Section -->
    <div class="description-section">
      <h2 class="section-title">Description</h2>
      <p class="description-text">
        {{ video.description || 'No description available for this video.' }}
      </p>
    </div>

    <!-- More on this Channel Section -->
    <div class="related-videos-section">
      <h2 class="section-title">More on this Channel</h2>
      <div class="related-videos-grid">
        @for (relatedVideo of relatedVideos; track relatedVideo.id) {
          <app-video-card
            [video]="relatedVideo"
            (videoClicked)="onVideoClick($event)"
          ></app-video-card>
        }
      </div>
    </div>
  }
</div>
