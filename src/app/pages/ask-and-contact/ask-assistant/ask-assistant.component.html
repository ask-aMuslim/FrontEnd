<div class="flex w-full flex-col">
  <div class="flex-1 w-full" [ngClass]="messages.length ? 'pb-28' : ''">
    <ng-container *ngIf="!messages.length; else chatView">
      <div class="flex items-center justify-end gap-2 text-lg font-bold">
        <span>Chats List</span>
        <img [src]="arrow" alt="arrow" />
      </div>

      <div class="flex flex-col items-center justify-center gap-2.5 my-24 text-center">
        <img [src]="logo" alt="logo" class="h-[164px] w-[206px]" />
        <span class="text-2xl font-medium text-(--color-text-placeholder)">Assalamualaikum</span>
        <h1 class="text-[36px] font-bold text-(--color-text-caption)">
          Do you have a religious question in mind?
        </h1>
      </div>

      <ng-container
        [ngTemplateOutlet]="askForm"
        [ngTemplateOutletContext]="{ sticky: false }"
      ></ng-container>
    </ng-container>

    <ng-template #chatView>
      <div class="flex flex-col gap-6">
        <div class="rounded-2xl border border-(--color-border-default) bg-white p-6 shadow-sm">
          <div
            #messagesContainer
            class="flex flex-col gap-4 max-h-[60vh] overflow-y-auto pr-2 scroll-smooth"
            aria-live="polite"
          >
            <div *ngFor="let message of messages; trackBy: trackByMessage" class="flex w-full">
              <div
                class="flex max-w-[90%] flex-col gap-1"
                [ngClass]="
                  message.role === 'user'
                    ? 'ml-auto items-end text-right'
                    : 'mr-auto items-start text-left'
                "
              >
                <div
                  class="rounded-lg px-4 py-4 text-base leading-relaxed"
                  [ngClass]="
                    message.role === 'user'
                      ? 'bg-(--color-surface-secondary) text-[20px]'
                      : 'bg-(--color-surface-primary) text-(--color-text-body) text-[20px]'
                  "
                >
                  {{ message.text }}
                </div>
              </div>
            </div>

            <div
              *ngIf="isResponding"
              class="mr-auto flex items-center gap-2 text-(--color-text-placeholder)"
            >
              <span class="h-2 w-2 animate-pulse rounded-full bg-(--color-text-placeholder)"></span>
              <span
                class="h-2 w-2 animate-pulse rounded-full bg-(--color-text-placeholder)"
                style="animation-delay: 120ms"
              ></span>
              <span
                class="h-2 w-2 animate-pulse rounded-full bg-(--color-text-placeholder)"
                style="animation-delay: 240ms"
              ></span>
              <span class="text-sm">Preparing an answer...</span>
            </div>
            <div #bottomAnchor class="h-0" aria-hidden="true"></div>
          </div>
        </div>
      </div>

      <ng-container
        [ngTemplateOutlet]="askForm"
        [ngTemplateOutletContext]="{ sticky: true }"
      ></ng-container>
    </ng-template>
  </div>

  <ng-template #askForm let-sticky="sticky">
    <form
      (submit)="submitQuestion($event)"
      class="flex w-full flex-col gap-4"
      [ngClass]="sticky ? 'sticky bottom-0 bg-white pb-6 pt-4' : 'mb-15'"
      autocomplete="off"
    >
      <div class="flex flex-col items-start gap-4 md:flex-row md:items-center">
        <div
          class="relative flex h-14 min-w-0 flex-1 items-center gap-2 rounded-lg border-[1.5px] border-(--color-text-placeholder) bg-white px-6 focus-within:border-(--special-primary)"
        >
          <input
            type="text"
            name="ask"
            #askInput
            [value]="inputValue"
            (input)="onInput($event.target.value)"
            (focus)="onFocus()"
            (blur)="onBlur()"
            placeholder="Enter your question .."
            class="min-w-0 flex-1 border-none p-0 text-base leading-[160%] focus:placeholder:text-black focus:ring-0"
            role="combobox"
            [attr.aria-expanded]="!messages.length && isSuggestionsOpen"
          />

          <div
            *ngIf="!messages.length && isSuggestionsOpen && filteredSuggestions.length"
            class="absolute left-0 right-0 top-[calc(100%+8px)] z-10 max-h-60 overflow-auto rounded-lg border border-gray-200 bg-white shadow-lg"
            role="listbox"
          >
            <div
              *ngFor="let suggestion of filteredSuggestions; let i = index"
              class="flex flex-col"
            >
              <button
                type="button"
                class="cursor-pointer px-6 py-2 text-left text-sm text-(--color-text-caption) hover:bg-gray-100"
                (mousedown)="selectSuggestion(suggestion)"
              >
                {{ suggestion }}
              </button>
              <div
                *ngIf="i < filteredSuggestions.length - 1"
                class="mx-6 h-0 border-b border-dashed border-(--color-border-default)"
              ></div>
            </div>
          </div>
        </div>
        <button type="submit" class="button flex h-14 w-[200px] items-center justify-center">
          <span class="text-lg font-semibold text-white">{{
            isResponding ? 'Working...' : 'Ask'
          }}</span>
        </button>
      </div>
    </form>
  </ng-template>
</div>
