<div class="flex items-center justify-center mb-8 md:mb-12 px-2 md:px-0">
  <div class="flex items-center w-full max-w-2xl gap-2">
    @for (step of steps(); track step.index; let isLast = $last) {
      <!-- Step -->
      <div class="flex flex-col items-center flex-1 min-w-0">
        <div
          class="w-8 h-8 md:w-9 md:h-9 rounded-full flex items-center justify-center text-[11px] md:text-sm font-medium transition-colors"
          [class.bg-(--color-selected-surface)]="currentStep() == step.index"
          [class.text-(--special-primary)]="currentStep() == step.index"
          [class.bg-(--special-primary)]="currentStep() > step.index"
          [class.text-white]="currentStep() > step.index"
          [class.bg-(--color-surface-secondary)]="currentStep() < step.index"
          [class.text-(--color-text-body)]="currentStep() < step.index"
        >
          {{ step.index }}
        </div>
        <span
          class="mt-2 text-[11px] md:text-sm font-medium text-center"
          [class.text-(--special-primary)]="currentStep() >= step.index"
          [class.text-(--color-text-caption)]="currentStep() < step.index"
        >
          {{ step.label }}
        </span>
      </div>

      <!-- Divider -->
      @if (!isLast) {
        <div
          class="h-1 flex-1 mx-1 md:mx-2 rounded-lg min-w-[20px]"
          [class.bg-(--special-primary)]="currentStep() > step.index"
          [class.bg-(--color-surface-secondary-2)]="currentStep() <= step.index"
        ></div>
      }
    }
  </div>
</div>
