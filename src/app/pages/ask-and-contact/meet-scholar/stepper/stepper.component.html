<div class="flex items-center justify-center mb-12">
  <div class="flex items-center w-full max-w-2xl">
    @for (step of steps(); track step.index; let isLast = $last) {
      <!-- Step -->
      <div class="flex flex-col items-center flex-1">
        <div
          class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-medium transition-colors"
          [class.bg-(--color-selected-surface)]="currentStep() == step.index"
          [class.text-(--special-primary)]="currentStep() == step.index"
          [class.bg-(--special-primary)]="currentStep() > step.index"
          [class.text-white]="currentStep() > step.index"
          [class.bg-(--color-surface-secondary)]="currentStep() < step.index"
          [class.text-(--color-text-body)]="currentStep() < step.index"
        >
          {{ step.index }}
        </div>
        <span
          class="mt-2 text-sm font-medium"
          [class.text-(--special-primary)]="currentStep() >= step.index"
          [class.text-(--color-text-caption)]="currentStep() < step.index"
        >
          {{ step.label }}
        </span>
      </div>

      <!-- Divider -->
      @if (!isLast) {
        <div
          class="h-1 w-[135px] mx-2 rounded-lg"
          [class.bg-(--special-primary)]="currentStep() > step.index"
          [class.bg-(--color-surface-secondary-2)]="currentStep() <= step.index"
        ></div>
      }
    }
  </div>
</div>
