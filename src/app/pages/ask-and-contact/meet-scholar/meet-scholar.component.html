<div>
  <!-- Header -->
  <div class="mb-10">
    <h1 class="mb-2">Book Your Meeting</h1>
    <p class="font-normal">
      Complete the steps below to schedule your free 30-minute session. We will respond to you
      within 48hr. to your email.
    </p>
  </div>

  <!-- Progress Steps -->
  <app-stepper [steps]="steps" [currentStep]="currentStep()" />

  <!-- Form -->
  <form [formGroup]="meetingForm" class="space-y-6">
    <!-- Step 1: Request -->
    @if (currentStep() === 1) {
      <app-request-step
        [form]="meetingForm"
        [topics]="topics"
        [languages]="languages"
        [availableLanguages]="availableLanguages()"
        [selectedLanguages]="selectedLanguages()"
        (next)="nextStep()"
        (addLanguage)="addLanguage($event)"
        (removeLanguage)="removeLanguage($event)"
      />
    }

    <!-- Step 2: Date & Time -->
    @if (currentStep() === 2) {
      <app-datetime-step
        [form]="meetingForm"
        [availableDates]="availableDates"
        [availableTimes]="availableTimes"
        (next)="nextStep()"
        (selectDate)="selectDate($event)"
        (selectTime)="selectTime($event)"
      />
    }

    <!-- Step 3: Review -->
    @if (currentStep() === 3) {
      <app-review-step
        [form]="meetingForm"
        [topics]="topics"
        [selectedLanguages]="selectedLanguages()"
        [isSubmitting]="isSubmitting()"
        (back)="previousStep()"
        (submit)="submitMeetingRequest()"
      />
    }
  </form>
</div>
