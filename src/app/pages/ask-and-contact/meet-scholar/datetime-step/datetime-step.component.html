<div class="space-y-8">
  <div>
    <label class="block text-base font-medium text-(--color-text-body) mb-2"
      >Meeting duration (minutes)</label
    >
    <input
      type="number"
      min="15"
      step="15"
      [formControl]="$any(form().get('durationMinutes'))"
      placeholder="30"
      class="w-full rounded-lg border border-(--color-border-medium) px-4 py-3 focus:outline-none focus:ring-2 focus:ring-(--special-primary) focus:border-transparent"
      [class.border-red-500]="
        form().get('durationMinutes')?.invalid && form().get('durationMinutes')?.touched
      "
    />
    <p
      *ngIf="form().get('durationMinutes')?.invalid && form().get('durationMinutes')?.touched"
      class="mt-1 text-sm"
      style="color: var(--color-error)"
    >
      Please enter a duration of at least 15 minutes
    </p>
  </div>

  <div>
    <label class="block text-base font-medium text-(--color-text-body) mb-4">Select Date:</label>
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
      <button
        type="button"
        *ngFor="let date of availableDates()"
        (click)="onSelectDate(date)"
        [disabled]="date.disabled"
        class="px-4 py-3 rounded-lg border text-sm font-normal transition-all"
        [class.bg-(--color-surface-primary)]="
          !date.disabled && form().get('scheduledDate')?.value === date.value
        "
        [class.border-(--color-border-medium)]="
          !date.disabled && form().get('scheduledDate')?.value === date.value
        "
        [class.text-(--special-primary)]="
          !date.disabled && form().get('scheduledDate')?.value === date.value
        "
        [class.bg-white]="!date.disabled && form().get('scheduledDate')?.value !== date.value"
        [style.border-color]="
          !date.disabled && form().get('scheduledDate')?.value !== date.value
            ? 'var(--color-surface-secondary-2)'
            : null
        "
        [class.cursor-pointer]="!date.disabled && form().get('scheduledDate')?.value !== date.value"
        [class.text-text-body]="!date.disabled && form().get('scheduledDate')?.value !== date.value"
        [class.bg-(--color-surface-secondary-2)]="date.disabled"
        [class.border-(--color-surface-secondary-2)]="date.disabled"
        [class.text-(--color-text-placeholder)]="date.disabled"
        [class.cursor-not-allowed]="date.disabled"
      >
        {{ date.label }}
      </button>
    </div>
  </div>

  <div *ngIf="form().get('scheduledDate')?.value">
    <label class="block text-base font-medium text-text-title mb-4">Select Time:</label>
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
      <button
        type="button"
        *ngFor="let time of availableTimes()"
        (click)="onSelectTime(time)"
        [disabled]="time.disabled"
        class="px-4 py-3 rounded-lg border text-sm font-normal transition-all"
        [class.bg-(--color-surface-primary)]="
          !time.disabled && form().get('scheduledTime')?.value === time.value
        "
        [class.border-(--color-border-medium)]="
          !time.disabled && form().get('scheduledTime')?.value === time.value
        "
        [class.text-(--special-primary)]="
          !time.disabled && form().get('scheduledTime')?.value === time.value
        "
        [class.bg-white]="!time.disabled && form().get('scheduledTime')?.value !== time.value"
        [style.border-color]="
          !time.disabled && form().get('scheduledTime')?.value !== time.value
            ? 'var(--color-surface-secondary-2)'
            : null
        "
        [class.cursor-pointer]="!time.disabled && form().get('scheduledTime')?.value !== time.value"
        [class.text-text-body]="!time.disabled && form().get('scheduledTime')?.value !== time.value"
        [class.bg-(--color-surface-secondary-2)]="time.disabled"
        [class.border-(--color-surface-secondary-2)]="time.disabled"
        [class.text-(--color-text-placeholder)]="time.disabled"
        [class.cursor-not-allowed]="time.disabled"
      >
        {{ time.label }}
      </button>
    </div>
  </div>

  <div class="flex justify-end">
    <button type="button" (click)="onNext()" class="button flex items-center gap-2">
      Next
      <img src="/icons/icons-24/arrow-right.svg" class="invert" />
    </button>
  </div>
</div>
