<div class="space-y-6">
  <div class="grid gap-4 md:grid-cols-2">
    <div>
      <label class="block text-[16px] font-medium text-(--color-text-body) mb-2">Your name</label>
      <input
        type="text"
        [formControl]="$any(form().get('name'))"
        placeholder="Full name"
        class="w-full rounded-lg border border-(--color-border-medium) px-4 py-3 focus:outline-none focus:ring-2 focus:ring-(--special-primary) focus:border-transparent"
        [class.border-red-500]="form().get('name')?.invalid && form().get('name')?.touched"
      />
      <p
        *ngIf="form().get('name')?.invalid && form().get('name')?.touched"
        class="mt-1 text-sm"
        style="color: var(--color-error)"
      >
        Please enter your name
      </p>
    </div>

    <div>
      <label class="block text-[16px] font-medium text-(--color-text-body) mb-2">Email</label>
      <input
        type="email"
        inputmode="email"
        [formControl]="$any(form().get('email'))"
        placeholder="you@example.com"
        class="w-full rounded-lg border border-(--color-border-medium) px-4 py-3 focus:outline-none focus:ring-2 focus:ring-(--special-primary) focus:border-transparent"
        [class.border-red-500]="form().get('email')?.invalid && form().get('email')?.touched"
      />
      <p
        *ngIf="form().get('email')?.invalid && form().get('email')?.touched"
        class="mt-1 text-sm"
        style="color: var(--color-error)"
      >
        Please enter a valid email
      </p>
    </div>
  </div>

  <div>
    <label class="block text-[16px] font-medium text-(--color-text-body) mb-2">
      Enter the area where you need scholar guidance:
    </label>
    <app-select-dropdown
      [options]="topics()"
      [value]="form().get('topic')?.value"
      placeholder="Subject"
      [error]="!!(form().get('topic')?.invalid && form().get('topic')?.touched)"
      (select)="onSelectTopic($event)"
    ></app-select-dropdown>
    <p
      *ngIf="form().get('topic')?.invalid && form().get('topic')?.touched"
      class="mt-1 text-sm"
      style="color: var(--color-error)"
    >
      Please select a subject
    </p>
  </div>

  <div>
    <textarea
      [formControl]="$any(form().get('message'))"
      rows="8"
      placeholder="Write your message here.."
      class="w-full px-4 py-3 resize-none focus:outline-none focus:ring-2 focus:ring-(--special-primary) focus:border-transparent"
      [class.border-red-500]="form().get('message')?.invalid && form().get('message')?.touched"
    ></textarea>
    <p
      *ngIf="form().get('message')?.invalid && form().get('message')?.touched"
      class="mt-1 text-sm"
      style="color: var(--color-error)"
    >
      Please enter a message (minimum 10 characters)
    </p>
  </div>

  <div>
    <label class="block text-[16px] font-medium text-(--color-text-body) mb-3">
      Add the languages you can understand:
    </label>
    <div class="relative">
      <app-chips-multiselect
        [options]="availableLanguages()"
        [selected]="selectedLanguages()"
        placeholder="Add more languages"
        [error]="languagesValidated() && selectedLanguages().length === 0"
        (add)="onAddLanguage($event)"
        (remove)="onRemoveLanguage($event)"
      ></app-chips-multiselect>
      <p
        *ngIf="languagesValidated() && selectedLanguages().length === 0"
        class="mt-1 text-sm"
        style="color: var(--color-error)"
      >
        Please select at least one language
      </p>
    </div>
  </div>

  <div class="flex justify-end">
    <button type="button" (click)="onNext()" class="button flex items-center gap-2">
      Next
      <img src="/icons/icons-24/arrow-right.svg" class="invert" />
    </button>
  </div>
</div>
