<section class="section-container ask-contact">
  <div class="section-block">
    <div class="ask-contact__layout">
      <app-sidebar class="ask-contact__sidebar"></app-sidebar>
      <div class="ask-contact__content">
        <router-outlet />
      </div>
    </div>
  </div>

  @if (isAskQa$ | async) {
    <div class="ask-contact__cta" data-aos="fade-up">
      <div class="section-block ask-contact__cta-inner">
        @if (isQuestion$ | async) {
          <h2 class="ask-contact__cta-title">Want to learn more?</h2>
          <p class="ask-contact__cta-text">
            Check the Academy for easier understanding the whole picture.
          </p>
          <div class="ask-contact__cta-actions">
            <button class="ask-question-btn" (click)="navigateToAcademy()">
              <span class="ask-question-btn__text">Check the Academy</span>
            </button>
            <button
              class="ask-question-btn ask-question-btn--outline"
              (click)="navigateToContact()"
            >
              <span class="ask-question-btn__text">Ask a Question</span>
            </button>
          </div>
        } @else {
          <h2 class="ask-contact__cta-title">Don't see your question?</h2>
          <p class="ask-contact__cta-text">
            Submit your own question and receive an answer from our
            knowledgeable scholars.
          </p>
          <div class="ask-contact__cta-actions">
            <button
              class="ask-question-btn ask-question-btn--outline"
              (click)="navigateToContact()"
            >
              <span class="ask-question-btn__text">Ask a Question</span>
            </button>
          </div>
        }
      </div>
    </div>
  }
</section>
