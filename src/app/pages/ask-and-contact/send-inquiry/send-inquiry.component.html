<div class="px-2 md:px-0">
  <div class="mb-6 md:mb-10">
    <h1 class="mb-2 text-xl md:text-[32px] lg:text-[40px] text-center md:text-left">
      Welcome, <span class="text-(--special-primary)">Pholan Elpholany</span>
    </h1>
    <p class="font-normal text-sm md:text-base sm:text-center md:text-left">
      If you have a new question or any kind of request or an issue, please provide it, and we will
      respond to you as soon as possible to your email.
    </p>
  </div>

  <div>
    <label class="block text-sm md:text-[16px] font-medium text-(--color-text-body) mb-3 md:mb-4">
      Enter the area where you need scholar guidance:
    </label>
    <app-select-dropdown
      [options]="topics()"
      [value]="formRef().get('topic')?.value"
      placeholder="Subject"
      [error]="!!(formRef().get('topic')?.invalid && formRef().get('topic')?.touched)"
      (select)="onSelectTopic($event)"
    ></app-select-dropdown>
    <p
      *ngIf="formRef().get('topic')?.invalid && formRef().get('topic')?.touched"
      class="mt-1 text-sm"
      style="color: var(--color-error)"
    >
      Please select a subject
    </p>
  </div>

  <div class="my-3 md:my-4">
    <textarea
      [formControl]="$any(formRef().get('message'))"
      rows="2"
      placeholder="Write here your exact question that you didn’t find its solution?"
      class="w-full px-3 md:px-4 py-2 md:py-3 text-sm md:text-base resize-none focus:outline-none focus:ring-2 focus:ring-(--special-primary) focus:border-transparent overflow-hidden"
      [class.border-red-500]="
        formRef().get('message')?.invalid && formRef().get('message')?.touched
      "
    ></textarea>
    <p
      *ngIf="formRef().get('message')?.invalid && formRef().get('message')?.touched"
      class="mt-1 text-sm"
      style="color: var(--color-error)"
    >
      Please enter your question (minimum 10 characters)
    </p>
  </div>

  <div>
    <textarea
      [formControl]="$any(formRef().get('details'))"
      rows="8"
      placeholder="Explain in particular what do you need to understand .. (optional)"
      class="w-full px-3 md:px-4 py-2 md:py-3 text-sm md:text-base resize-none focus:outline-none focus:ring-2 focus:ring-(--special-primary) focus:border-transparent"
    ></textarea>
  </div>

  <div class="my-4 md:my-6">
    <label class="block text-sm md:text-[16px] font-medium text-(--color-text-body) mb-2 md:mb-3">
      Add the languages you can understand:
    </label>
    <div class="relative">
      <app-chips-multiselect
        [options]="availableLanguages()"
        [selected]="selectedLanguagesRef()"
        placeholder="Add more languages"
        [error]="languagesValidated() && selectedLanguagesRef().length === 0"
        (add)="onAddLanguage($event)"
        (remove)="onRemoveLanguage($event)"
      ></app-chips-multiselect>
      <p
        *ngIf="languagesValidated() && selectedLanguagesRef().length === 0"
        class="mt-1 text-sm"
        style="color: var(--color-error)"
      >
        Please select at least one language
      </p>
    </div>
  </div>

  <div class="flex justify-end mb-5">
    <button
      type="button"
      (click)="onNext()"
      class="button flex items-center justify-center gap-2 w-full sm:w-auto px-6 md:px-8 py-3 md:py-3.5 text-sm md:text-base"
    >
      Send
      <img src="/icons/icons-24/arrow-right.svg" class="invert w-4 md:w-5" />
    </button>
  </div>
</div>
