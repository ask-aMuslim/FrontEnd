<div class="px-4 md:px-6 py-12 md:py-24 space-y-4 md:space-y-6">
  <div class="flex justify-center">
    <span class="icon-circle">
      <span
        class="done-icon"
        [style.maskImage]="'url(' + doneIcon + ')'"
        [style.webkitMaskImage]="'url(' + doneIcon + ')'"
      ></span>
    </span>
  </div>

  <div class="text-center mt-2 space-y-2">
    <h1 class="text-2xl md:text-3xl lg:text-[40px] font-bold text-(--color-text-title)">
      Your inquiry was sent successfully!
    </h1>
    <p class="text-sm md:text-base font-normal text-(--color-text-body)">
      Thanks for Contacting Us. We will respond to your email as soon as possible.
    </p>
  </div>

  <div
    class="bg-(--color-surface-secondary) rounded-lg px-4 py-4 md:px-6 md:py-5 lg:p-6 space-y-3 md:space-y-6"
  >
    <h2 class="text-lg md:text-xl font-medium text-(--color-text-title)">Subject:</h2>

    <div *ngIf="hasDetails()" class="space-y-2">
      <p class="text-sm text-(--color-text-title)" *ngIf="message">{{ message }}</p>
      <p class="text-sm text-(--color-text-body)" *ngIf="details">{{ details }}</p>
    </div>
  </div>

  <div class="flex flex-col sm:flex-row justify-center gap-3 sm:gap-4">
    <button type="button" class="button" (click)="goToAccount()">Go to Profile</button>
  </div>
</div>
