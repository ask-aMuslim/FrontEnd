<!-- src/app/pages/ask-and-contact/ask-Q&A/ask-qa/ask-qa.component.html -->
<div class="flex w-full flex-1 flex-col items-center justify-center gap-8 lg:gap-10 lg:pr-24">
  <div class="flex flex-col items-start gap-6 w-full">
    <div class="flex flex-col md:flex-row items-start md:items-center gap-4 w-full">
      <div
        class="flex h-14 min-w-0 flex-1 items-center gap-2 rounded-lg border-[1.5px] border-border-normal bg-white px-4 sm:px-6"
      >
        <img
          src="/icons/icons 24/select=search.svg"
          alt="search icon"
          class="h-5 w-5 object-contain"
        />
        <input
          type="text"
          placeholder="Write your question here .."
          class="min-w-0 flex-1 border-none text-base leading-[160%] focus:ring-0"
        />
      </div>

      <button
        class="button flex h-14 w-full items-center justify-center gap-1 rounded-lg px-8 md:w-auto"
      >
        <span class="text-lg font-semibold text-white">Search</span>
      </button>
    </div>

    <div class="category-scroll flex w-full flex-nowrap items-center gap-2 overflow-x-auto">
      <button
        *ngFor="let category of categories; let i = index"
        (click)="selectedCategory = i"
        [ngClass]="selectedCategory === i ? 'secondary-button' : 'text-text-body'"
        class="flex shrink-0 items-center gap-3 rounded-lg border-b-3 border-transparent px-6 py-3 transition-colors capitalize cursor-pointer"
      >
        <span class="text-lg font-medium">{{ category }}</span>
      </button>
    </div>
  </div>

  <div class="flex flex-col items-start gap-6 w-full">
    <ng-container *ngFor="let question of questions; let isLast = last">
      <app-qa-card [question]="question" />
      <div *ngIf="!isLast" class="w-full h-[1.5px] bg-border-brand"></div>
    </ng-container>
  </div>

  <div
    class="flex flex-wrap items-center justify-center gap-1 rounded border-0 border-gray-300 sm:flex-nowrap"
  >
    <button
      type="button"
      (click)="prevPage()"
      class="flex h-10 w-10 items-center justify-center gap-2 rounded-lg cursor-pointer"
    >
      <img
        src="/icons/icons%2024/select=arrow%20left.svg"
        alt="Previous page"
        class="h-6 w-6 object-contain"
      />
    </button>

    <button
      *ngFor="let page of pages"
      type="button"
      (click)="goToPage(page)"
      [ngClass]="
        page === currentPage
          ? 'bg-(--color-surface-primary) border-(--special-primary) text-(--special-primary)'
          : 'text-text-title'
      "
      class="flex h-10 w-10 items-center justify-center gap-2 rounded-lg border-2 border-transparent cursor-pointer"
    >
      <span class="text-sm font-medium">{{ page }}</span>
    </button>

    <button
      type="button"
      (click)="nextPage()"
      class="flex h-10 w-10 items-center justify-center gap-2 rounded-lg cursor-pointer"
    >
      <img
        src="/icons/icons%2024/select=arrow%20right.svg"
        alt="Next page"
        class="h-6 w-6 object-contain"
      />
    </button>
  </div>

  <div
    class="relative right-30 ml-[-50vw] mr-[-50vw] w-screen h-[262px] bg-(--color-surface-secondary-hover)"
  >
    <div class="flex flex-col h-full items-center justify-center gap-6">
      <h2 class="text-(length:--font-size-24) font-semibold">Don’t see your question?</h2>
      <p>Submit your own question and receive an answer from our knowledgeable scholars.</p>
      <button class="ask-question-btn">
        <span class="ask-question-btn__text text-sm font-semibold">Ask a Question</span>
      </button>
    </div>
  </div>
</div>
