<section class="not-found-page">
  <!-- Background decorative elements -->
  <div class="background-pattern" aria-hidden="true"></div>

  <!-- Floating geometric shapes -->
  <div class="floating-shapes" aria-hidden="true">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
    <div class="shape shape-5"></div>
    <div class="shape shape-6"></div>
  </div>

  <div class="not-found-content">
    <!-- Main 404 display -->
    <div class="error-display">
      <div class="error-code">
        <span class="digit digit-4-left">4</span>
        <span class="digit digit-0">
          <svg class="crescent-moon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="moonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop
                  offset="0%"
                  style="stop-color: var(--color-button-primary-normal); stop-opacity: 1"
                />
                <stop
                  offset="100%"
                  style="stop-color: var(--color-button-primary-hovering); stop-opacity: 1"
                />
              </linearGradient>
            </defs>
            <circle cx="50" cy="50" r="45" fill="url(#moonGradient)" />
            <circle cx="65" cy="40" r="35" fill="var(--color-background-white)" />
            <!-- Star decoration -->
            <polygon
              points="25,30 27,35 32,35 28,38 30,43 25,40 20,43 22,38 18,35 23,35"
              fill="var(--color-button-secondary-normal)"
              class="star-accent"
            />
          </svg>
        </span>
        <span class="digit digit-4-right">4</span>
      </div>
    </div>

    <!-- Message section -->
    <div class="message-section">
      <h1 class="title">Page Not Found</h1>
      <p class="subtitle">
        The path you seek Is not here. Perhaps it has moved, or maybe
        <br class="hide-mobile" />
        it was never meant to be. Let us guide you back.
      </p>
    </div>

    <!-- Primary action -->
    <a routerLink="/home" class="primary-button">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="currentColor" />
      </svg>
      <span>Return Home</span>
    </a>

    <!-- Quick links section -->
    <div class="quick-links-section">
      <p class="quick-links-label">Or explore these pages:</p>
      <nav class="quick-links" aria-label="Quick navigation">
        @for (link of quickLinks; track trackByPath($index, link)) {
          <a [routerLink]="link.path" class="quick-link">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path [attr.d]="link.icon" fill="currentColor" />
            </svg>
            <span>{{ link.label }}</span>
          </a>
        }
      </nav>
    </div>
  </div>
</section>
