<div class="edit-form">
  <div class="edit-form__header">
    <h2 class="edit-form__title">Edit Contact Information</h2>
    <div [inlineSVG]="'/icons/icons-24/user-edit.svg'" class="edit-form__icon"></div>
  </div>

  <div class="edit-form__fields">
    <div class="edit-form__field">
      <label class="edit-form__label">City / Country</label>
      <input
        type="text"
        [(ngModel)]="city"
        placeholder="e.g., Cairo, Egypt"
        class="edit-form__input"
      />
    </div>

    <div class="edit-form__field">
      <label class="edit-form__label">Phone Number</label>
      <input
        type="tel"
        [(ngModel)]="phoneNumber"
        placeholder="+20 123 456 7890"
        class="edit-form__input"
      />
    </div>

    <div class="edit-form__field">
      <label class="edit-form__label">Email</label>
      <input
        type="email"
        [(ngModel)]="email"
        placeholder="user@example.com"
        class="edit-form__input"
      />
    </div>
  </div>

  <div class="edit-form__actions">
    <button (click)="onCancel()" class="edit-form__btn edit-form__btn--cancel">Cancel</button>
    <button (click)="onSave()" class="edit-form__btn edit-form__btn--save">Save</button>
  </div>
</div>
