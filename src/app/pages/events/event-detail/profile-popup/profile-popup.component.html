<div
  class="fixed inset-0 bg-black/30 flex items-center justify-center z-50 animate-fadeIn"
  (click)="closePopup()"
>
  <div
    class="bg-white rounded-2xl p-8 w-[571px] max-w-md mx-4 shadow-(--shadow-4-green) transform transition-all duration-300 animate-scaleIn relative"
    (click)="$event.stopPropagation()"
  >
    <div class="event-profile-popup" (click)="closePopup()">
      <div
        class="event-profile-popup__dialog"
        (click)="$event.stopPropagation()"
        role="dialog"
        aria-modal="true"
        aria-labelledby="event-profile-popup-title"
      >
        <button
          type="button"
          (click)="closePopup()"
          class="event-profile-popup__close-button"
          aria-label="Close profile prompt"
        >
          <svg
            class="event-profile-popup__close-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        </button>

        <div class="event-profile-popup__icon-shell">
          <img
            src="/icons/icons-24/done.svg"
            alt=""
            class="event-profile-popup__icon"
          />
        </div>

        <div class="event-profile-popup__divider"></div>

        <div class="event-profile-popup__content">
          <h3 id="event-profile-popup-title" class="event-profile-popup__title">
            Complete Your Profile
          </h3>
          <p class="event-profile-popup__message">
            The meeting link will be sent to your email
          </p>
        </div>

        <div class="event-profile-popup__actions">
          <button
            type="button"
            (click)="closePopup()"
            class="event-profile-popup__secondary-button"
          >
            Later
          </button>
          <button
            type="button"
            (click)="goToProfile()"
            class="event-profile-popup__primary-button"
          >
            Go to Profile
          </button>
        </div>
      </div>
    </div>
    Just complete your profile data, so you can join the "Events" and interact
    with the scholars
  </div>
</div>
