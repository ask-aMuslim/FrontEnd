<div
  class="fixed inset-0 bg-black/30 flex items-center justify-center z-50 animate-fadeIn"
  (click)="closePopup()"
>
  <div
    class="bg-white rounded-2xl p-8 w-[571px] max-w-md mx-4 shadow-2xl transform transition-all duration-300 animate-scaleIn relative"
    (click)="$event.stopPropagation()"
  >
    <!-- Close Button -->
    <button
      (click)="closePopup()"
      class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-all duration-200 cursor-pointer hover:scale-110 hover:rotate-90"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        ></path>
      </svg>
    </button>

    <!-- Icon -->
    <div class="flex justify-center mb-6">
      <div
        class="bg-(--color-card-surface-primary) rounded-full p-4 transition-all duration-500 hover:scale-110 hover:shadow-lg hover:rotate-12 cursor-pointer"
      >
        <div
          [inlineSVG]="'/icons/icons-24/done.svg'"
          class="[&_path]:stroke-(--color-success-base) [&>svg]:w-12 [&>svg]:h-12"
        ></div>
      </div>
    </div>

    <div class="w-full h-px bg-(--color-card-surface-secondary-2) my-6 animate-fadeIn"></div>

    <p
      class="text-(--color-text-body)! leading-relaxed text-center mb-6 transition-all duration-300 hover:scale-105"
    >
      The meeting link will be sent to your email
    </p>

    <div class="flex gap-4">
      <button
        (click)="closePopup()"
        class="flex-1 px-6 py-3 border-2 border-(--color-button-primary-normal) text-(--color-button-primary-normal) rounded-lg hover:bg-(--color-card-surface-primary) transition-all duration-300 hover:scale-110 hover:shadow-xl hover:-translate-y-1 cursor-pointer"
      >
        Cancel
      </button>
      <button
        (click)="confirmShare()"
        class="flex-1 px-6 py-3 bg-(--color-button-primary-normal) text-white rounded-lg hover:shadow-2xl transition-all duration-300 hover:scale-110 hover:-translate-y-1 cursor-pointer"
      >
        Share
      </button>
    </div>
  </div>
</div>
