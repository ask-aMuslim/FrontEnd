<div (click)="onCardClick()" class="event-card">
  <div class="event-card__image-wrapper">
    <div class="event-card__image-inner">
      <img
        [src]="event.imageUrl"
        [alt]="event.imageAlt"
        (error)="onEventImageError($event)"
        class="event-card__image"
      />
    </div>
  </div>

  <div class="event-card__content">
    <div class="event-card__meta">
      @if (event.isRecorded) {
        <div class="event-card__badge event-card__badge--recorded">
          <span class="event-card__badge-text event-card__badge-text--recorded">Recorded</span>
        </div>
      }
      @if (!event.isRecorded) {
        <div class="event-card__badge event-card__badge--live">
          <span class="event-card__badge-text event-card__badge-text--live">&bull; Live</span>
        </div>
      }
      <div class="event-card__date">
        <div [inlineSVG]="'/icons/icons-16/calendar.svg'" class="event-card__date-icon"></div>
        <span class="event-card__date-text">{{ event.date }}</span>
      </div>
    </div>

    <div class="event-card__body">
      <h2 class="event-card__title">{{ event.title }}</h2>
      <div class="event-card__description-wrapper">
        <span class="event-card__description">{{ event.description }}</span>
      </div>
    </div>

    <div class="event-card__speaker">
      <img
        [src]="event.speakerImage"
        alt="speaker"
        (error)="onSpeakerImageError($event)"
        class="event-card__speaker-image"
      />
      <div class="event-card__speaker-info">
        <span class="event-card__speaker-name">{{ event.speakerName }}</span>
        <span class="event-card__speaker-role">{{ event.speakerRole }}</span>
      </div>
    </div>

    <div class="event-card__divider"></div>

    <div class="event-card__tags">
      @for (tag of event.tags; track tag) {
        <div class="event-card__tag">
          <span class="event-card__tag-text">{{ tag }}</span>
        </div>
      }
    </div>
  </div>
</div>
