<div
  (click)="onCardClick()"
  class="flex overflow-hidden shadow-(--shadow-15) items-start rounded-lg flex-col bg-white h-full min-h-[520px] transition-all duration-300 hover:shadow-2xl hover:-translate-y-2 cursor-pointer group"
>
  <div class="h-60 flex overflow-hidden self-stretch items-start flex-col">
    <div class="flex overflow-hidden grow self-stretch items-start">
      <img
        [src]="event.imageUrl"
        [alt]="event.imageAlt"
        class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
      />
    </div>
  </div>

  <div
    class="flex flex-col gap-4 p-[16px_24px_24px] self-stretch items-start flex-1 overflow-hidden"
  >
    <div class="flex gap-4 self-stretch items-center justify-between">
      <div
        *ngIf="event.isRecorded"
        class="flex gap-1 h-8 px-3 py-1 items-center border border-(--color-success-base) rounded-full justify-center bg-(--color-surface-primary) transition-all duration-300 hover:bg-(--color-success-base) hover:scale-105"
      >
        <span
          class="text-(--color-success-base) text-center leading-normal text-[14px] font-medium transition-colors duration-300 hover:text-white"
        >
          Recorded
        </span>
      </div>
      <div
        *ngIf="!event.isRecorded"
        class="flex gap-1 h-8 px-3 py-1 items-center border border-(--chips-data-2) rounded-full justify-center bg-(--chips-selected-data-surface) transition-all duration-300 hover:bg-(--chips-data-2) hover:scale-105 animate-pulse"
      >
        <span
          class="text-(--chips-data-2) text-center leading-normal text-[14px] font-medium transition-colors duration-300 hover:text-white"
        >
          • Live
        </span>
      </div>
      <div class="flex gap-1 h-6 items-center">
        <img src="/icons/icons-16/calendar.svg" alt="Calendar" />
        <span class="text-(--color-text-body) text-left leading-[160%]">
          {{ event.date }}
        </span>
      </div>
    </div>

    <div class="flex flex-col gap-2 self-stretch items-start">
      <h2
        class="text-(--color-text-title) text-left leading-normal self-stretch font-medium text-[20px] transition-colors duration-300 group-hover:text-(--color-success-base)"
      >
        {{ event.title }}
      </h2>
      <div class="h-12 flex overflow-hidden self-stretch items-start">
        <span class="text-(--color-text-body) text-left leading-[160%] text-[16px]">
          {{ event.description }}
        </span>
      </div>
    </div>

    <div class="flex gap-3 self-stretch items-center">
      <img
        [src]="event.speakerImage"
        alt="speaker"
        class="w-12 h-12 rounded-full object-cover transition-transform duration-300 hover:scale-110 hover:rotate-6"
      />
      <div class="flex items-start flex-col">
        <div class="flex self-stretch items-start">
          <span class="text-(--color-text-title) text-left leading-normal text-[14px] font-medium">
            {{ event.speakerName }}
          </span>
        </div>
        <div class="flex self-stretch items-start">
          <span
            class="text-(--color-text-caption) grow text-left leading-normal text-[14px] font-normal"
          >
            {{ event.speakerRole }}
          </span>
        </div>
      </div>
    </div>

    <div class="w-full h-px bg-(--color-surface-secondary-2)"></div>

    <div class="flex flex-wrap gap-2 self-stretch items-start">
      <div
        *ngFor="let tag of event.tags"
        class="flex gap-1 h-8 px-3 py-1 items-center rounded-full justify-center bg-(--color-surface-primary) transition-all duration-300 hover:bg-(--color-text-caption) hover:scale-105 cursor-pointer"
      >
        <span
          class="text-(--color-text-caption) text-center leading-normal text-[14px] font-medium transition-colors duration-300 hover:text-white"
          >{{ tag }}</span
        >
      </div>
    </div>
  </div>
</div>
