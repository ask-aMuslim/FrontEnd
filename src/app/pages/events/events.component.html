<section class="section-container">
  <div class="section-block py-6 md:py-10">
    <!-- Featured Event Hero -->
    <div class="events-hero">
      <div class="events-hero__content">
        <div class="events-hero__meta">
          <div class="events-hero__badges">
            <div class="events-hero__badge">
              <span class="events-hero__badge-text">Upcoming Event</span>
            </div>
            <div class="events-hero__dot">&bull;</div>
            <div class="events-hero__open-label">
              <span class="events-hero__open-text">Free &amp; Open to All</span>
            </div>
          </div>

          <span class="events-hero__title">
            The Islamic rules in relationships between family members and friends
          </span>
        </div>

        <div class="events-hero__details">
          <div class="events-hero__detail-item">
            <img
              src="/icons/icons-16/calendar.svg"
              alt="Calendar Icon"
              class="events-hero__detail-icon"
            />
            <span class="events-hero__detail-text">31 Dec, 2025</span>
          </div>

          <div class="events-hero__detail-item">
            <img
              src="/icons/icons-16/clock.svg"
              alt="Clock Icon"
              class="events-hero__detail-icon"
            />
            <span class="events-hero__detail-text">1 pm .. 4 pm</span>
          </div>

          <div class="events-hero__detail-item">
            <img
              src="/icons/icons-16/live.svg"
              alt="Live Session Icon"
              class="events-hero__detail-icon"
            />
            <span class="events-hero__detail-text">Live Session</span>
          </div>
        </div>

        <div class="events-hero__actions">
          <div class="events-hero__actions-inner">
            <button class="events-hero__register-btn">
              <span class="events-hero__register-text">Register Now</span>
              <div class="events-hero__register-icon">
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M8 20L16 12L8 4"
                    stroke="var(--color-button-primary-normal)"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </div>
            </button>
            <button class="events-hero__share-btn">
              <img
                src="/icons/icons-24/share.svg"
                alt="Share Icon"
                class="events-hero__share-icon"
              />
              <span class="events-hero__share-text">Share</span>
            </button>
          </div>
        </div>
      </div>

      <div class="events-hero__date-box">
        <h1 class="events-hero__date-day">31</h1>
        <h2 class="events-hero__date-month">Dec</h2>
      </div>
    </div>

    <!-- Recorded Events Section -->
    <div class="events-recorded">
      <div class="events-recorded__header">
        <h2 class="events-recorded__title">Recorded Events</h2>

        <div class="events-search">
          <div class="events-search__input-wrapper">
            <div [inlineSVG]="'/icons/icons-24/search.svg'" class="events-search__icon"></div>
            <input type="text" placeholder="Search for events .." class="events-search__input" />
          </div>

          <button type="button" class="events-search__btn">
            <span class="events-search__btn-text">Search</span>
          </button>
        </div>

        <div class="events-grid">
          @for (event of paginatedEventCards; track event) {
            <app-event-card [event]="event"></app-event-card>
          }
        </div>
      </div>

      <!-- Pagination -->
      <div class="events-pagination">
        <button type="button" (click)="prevPage()" class="events-pagination__arrow">
          <div
            [inlineSVG]="'/icons/icons-24/arrow-left.svg'"
            [class.events-pagination__arrow-icon--disabled]="isFirstPage"
            [class.events-pagination__arrow-icon--active]="!isFirstPage"
            class="events-pagination__arrow-icon"
          ></div>
        </button>

        @for (page of pages; track $index) {
          <button
            type="button"
            (click)="goToPage(page)"
            class="events-pagination__page"
            [class.events-pagination__page--active]="page === currentPage"
          >
            <span class="events-pagination__page-text">{{ page }}</span>
          </button>
        }

        <button type="button" (click)="nextPage()" class="events-pagination__arrow">
          <div
            [inlineSVG]="'/icons/icons-24/arrow-right.svg'"
            [class.events-pagination__arrow-icon--disabled]="isLastPage"
            [class.events-pagination__arrow-icon--active]="!isLastPage"
            class="events-pagination__arrow-icon"
          ></div>
        </button>
      </div>
    </div>
  </div>
</section>
