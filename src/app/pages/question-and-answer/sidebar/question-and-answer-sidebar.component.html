<!-- Sidebar Component -->
<aside class="sidebar-container" [class.collapsed]="isCollapsed">
  <!-- Collapse Toggle -->
  <button
    type="button"
    class="collapse-btn hidden lg:block p-2 bg-orange-50 rounded-lg cursor-pointer"
    (click)="toggleCollapsed()"
    [attr.aria-expanded]="!isCollapsed"
    aria-controls="ask-contact-sidebar-nav"
  >
    <img
      src="/icons/icons-24/collapse.svg"
      alt="Toggle Sidebar"
      class="h-6 w-6 shrink-0"
      [class.rotate-180]="!isCollapsed"
    />
  </button>

  <nav
    id="ask-contact-sidebar-nav"
    class="flex w-full flex-row items-center justify-evenly gap-2 sm:gap-3 md:gap-4 lg:flex-col lg:items-start lg:justify-start lg:gap-4"
  >
    @for (item of menuItems; track trackByKey($index, item)) {
      <a
        [routerLink]="item.href"
        routerLinkActive="secondary-button border-b-3 lg:border-b-0 lg:border-r-3 border-[var(--color-button-primary-normal)] rounded-b-none lg:rounded-b-lg lg:rounded-r-none"
        [routerLinkActiveOptions]="{ exact: false }"
        #rla="routerLinkActive"
        [attr.aria-label]="item.label"
        [class.is-active]="rla.isActive"
        class="sidebar-item flex h-13 w-auto lg:w-full items-center justify-center lg:justify-start px-3 py-3"
      >
        <span
          class="sidebar-icon h-6 w-6 shrink-0"
          [class.is-active]="rla.isActive"
          [style.webkitMaskImage]="'url(' + item.icon + ')'"
          [style.maskImage]="'url(' + item.icon + ')'"
          role="img"
        ></span>
        <span
          class="sidebar-label lg:block hidden"
          [class.collapsed-label]="isCollapsed"
          [class.text-primary]="rla.isActive"
          [class.text-text-title]="!rla.isActive"
          [attr.aria-hidden]="isCollapsed ? 'true' : null"
        >
          {{ item.label }}
        </span>
      </a>
    }
  </nav>
</aside>
