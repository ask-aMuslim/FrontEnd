<div class="custom-select" [class.error]="error()">
  <button type="button" class="select-trigger chips-trigger" (click)="toggleDropdown()">
    <div class="selected-chips" [class.placeholder]="selected().length === 0">
      <ng-container *ngIf="selected().length > 0; else placeholderTemplate">
        <div *ngFor="let chip of selected()" class="chip">
          <span>{{ chip.label }}</span>
          <button
            type="button"
            *ngIf="selected().length > 1"
            (click)="onRemove($event, chip)"
            aria-label="Remove"
          >
            ×
          </button>
        </div>
      </ng-container>
      <ng-template #placeholderTemplate>
        <span>{{ placeholder() }}</span>
      </ng-template>
    </div>
    <img [src]="icon()" alt="" class="arrow-icon" [class.open]="isOpen()" />
  </button>
  <ul class="options" *ngIf="isOpen()">
    <li *ngFor="let option of options()" class="option" (click)="onAdd(option)">
      {{ option.label }}
    </li>
  </ul>
</div>
