<div class="custom-select" [class.error]="error()">
  <button type="button" class="select-trigger chips-trigger" (click)="toggleDropdown()">
    <div class="selected-chips" [class.placeholder]="selected().length === 0">
      @if (selected().length > 0) {
        @for (chip of selected(); track chip) {
          <div class="chip">
            <span>{{ chip.label }}</span>
            @if (selected().length > 1) {
              <button
                type="button"
                (click)="onRemove($event, chip)"
                aria-label="Remove"
                >
                ×
              </button>
            }
          </div>
        }
      } @else {
        <span>{{ placeholder() }}</span>
      }
    </div>
    <img [src]="icon()" alt="" class="arrow-icon" [class.open]="isOpen()" />
  </button>
  @if (isOpen()) {
    <ul class="options">
      @for (option of options(); track option) {
        <li class="option" (click)="onAdd(option)">
          {{ option.label }}
        </li>
      }
    </ul>
  }
</div>
