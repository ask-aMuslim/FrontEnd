@if (isVisible) {
  <div class="announcement-bar" [class.closing]="isClosing">
    <div class="announcement-content">
      <p class="announcement-text">
        <a [routerLink]="['/account']" class="hover:underline cursor-pointer text-white">
          Complete your profile data to join the "Events" and interact with
          the scholars live
        </a>
      </p>
      <button
        type="button"
        class="close-btn"
        (click)="closeBar()"
        aria-label="Close announcement">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <path d="M18 6L6 18M6 6L18 18" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>
  }
