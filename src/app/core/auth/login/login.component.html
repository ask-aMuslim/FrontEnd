<div class="login-page">
    <div class="login-left">
        <div class="logo-section">
            <img src="footer/footer logo big.svg" alt="Ask A Muslim Logo"
                class="logo" />
            <p class="stat-text">
                <span class="stat-number">1,700,556,000+</span> Muslim brothers
                & sisters around the world
            </p>
        </div>
    </div>

    <div class="login-right">
        <div class="login-header">
            <a [routerLink]="'/home'" class="guest-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 18L9 12L15 6" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                <span class="guest-link__text">Continue as Guest</span>
            </a>
        </div>

        <div class="login-card">
            <h1 class="login-title">Welcome Back</h1>
            <p class="login-subtitle">Sign in to continue your journey</p>

            <div class="social-buttons">
                <button type="button" class="social-btn social-btn--google">
                    <img
                        src="/icons/icons social apps/material-icon-theme_google.svg"
                        alt="Google" />
                    <span>Sign in with Google</span>
                </button>
                <button type="button" class="social-btn social-btn--facebook">
                    <img src="/icons/icons social apps/Property 1=facebook.svg"
                        alt="Facebook" />
                    <span>Sign in with Facebook</span>
                </button>
            </div>

            <div class="divider">
                <span>or</span>
            </div>

            <form class="login-form" [formGroup]="loginForm"
                (ngSubmit)="onSubmit()" novalidate>
                <div class="form-group"
                    [class.form-group--error]="isFieldInvalid('email')"
                    [class.form-group--focused]="fieldFocused['email']">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <input
                            type="email"
                            id="email"
                            formControlName="email"
                            placeholder="your@email.com"
                            class="form-input"
                            (focus)="onFieldFocus('email')"
                            (blur)="onFieldBlur('email')"
                            autocomplete="email" />
                        <span class="form-error-tooltip"
                            *ngIf="isFieldInvalid('email')">
                            {{ getFieldError('email') }}
                        </span>
                    </div>
                </div>

                <div class="form-group"
                    [class.form-group--error]="isFieldInvalid('password')"
                    [class.form-group--focused]="fieldFocused['password']">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <div class="password-wrapper">
                            <input
                                [type]="showPassword ? 'text' : 'password'"
                                id="password"
                                formControlName="password"
                                placeholder="Enter your password"
                                class="form-input"
                                (focus)="onFieldFocus('password')"
                                (blur)="onFieldBlur('password')"
                                autocomplete="current-password" />
                            <button
                                type="button"
                                class="password-toggle"
                                (click)="togglePassword()"
                                tabindex="-1"
                                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
                                <img
                                    [src]="showPassword ? '/icons/icons 24/select=eye.svg' : '/icons/icons 24/select=eye off.svg'"
                                    alt />
                            </button>
                        </div>
                        <span class="form-error-tooltip"
                            *ngIf="isFieldInvalid('password')">
                            {{ getFieldError('password') }}
                        </span>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" formControlName="rememberMe"
                            class="remember-checkbox" />
                        <span class="remember-text">Remember me</span>
                    </label>
                    <a [routerLink]="'/auth/forgot-password'"
                        class="forgot-link">Forgot Password?</a>
                </div>

                <button
                    type="submit"
                    class="submit-btn"
                    [class.submit-btn--loading]="isSubmitting"
                    [class.submit-btn--success]="submitSuccess"
                    [disabled]="isSubmitting">
                    <span class="submit-btn__text"
                        *ngIf="!isSubmitting && !submitSuccess">Sign In</span>
                    <span class="submit-btn__loading" *ngIf="isSubmitting">
                        <span class="spinner"></span>
                        Signing In...
                    </span>
                    <span class="submit-btn__success" *ngIf="submitSuccess">
                        <span class="success-icon">✓</span>
                        Welcome Back!
                    </span>
                </button>
            </form>

            <p class="signup-link">
                Don't have an account?
                <a [routerLink]="'/register'"
                    class="signup-link__cta">Create Account</a>
            </p>
        </div>
    </div>
</div>
