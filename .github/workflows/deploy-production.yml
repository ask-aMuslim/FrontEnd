name: Deploy Web to Production

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh

          # Write private key correctly
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Add server to known hosts
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Server via SSH
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'

            echo "🚀 Starting web deployment..."

            cd /srv/docker/web/FrontEnd

            echo "📥 Pulling latest code from production branch..."
            git fetch origin
            git reset --hard origin/production

            cd /srv/docker

            echo "🔨 Rebuilding Web Docker image..."
            docker compose build web

            echo "♻️ Restarting Web container..."
            docker compose up -d web

            echo "⏳ Waiting for Web to become healthy..."
            for i in $(seq 1 30); do
              if docker compose ps web | grep -q "healthy"; then
                echo "✅ Web is healthy and running!"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done

            echo "📊 Deployment Status:"
            docker compose ps web

            echo "✨ Deployment completed successfully!"
          EOF

      - name: Notify Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment succeeded!"
          else
            echo "❌ Deployment failed!"
            exit 1
          fi
