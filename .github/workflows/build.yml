name: Build Web

on:
  pull_request:
    branches:
      - main
      - master
      - dev
      - develop
  push:
    branches:
      - main
      - master
      - dev
      - develop

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies (dev + prod)
      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      # 4. Lint (non-fatal)
      - name: Run lint
        continue-on-error: true
        run: npm run lint --if-present || echo "lint errors ignored"

      # 5. Build project (compilation check)
      - name: Build Angular app
        run: npm run build --if-present
